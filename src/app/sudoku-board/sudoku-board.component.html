<div class="sudoku-container">
    <form [formGroup]="boardForm">
        <div class="grid">
            <div class="row" *ngFor="let row of board.controls; let i = index">
                <input type="number" *ngFor="let cell of cell(i).controls; let j = index" [formControl]="getCellControl(i, j)"
                    [class.invalid]="cell.invalid" min="1" max="9" />
            </div>
        </div>
    </form>
    <div class="buttons">
        <button (click)="validateSudoku()">Check</button>
        <button (click)="resetBoard()">Reset</button>
    </div>
</div>
